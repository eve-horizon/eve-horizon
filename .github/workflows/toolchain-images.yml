name: Build Toolchain Images

# Independent toolchain version. No AWS mutations or deployment dispatch.
on:
  push:
    tags: ['toolchain-images/v*']
  workflow_dispatch: # Full build and native gate only; never publishes.

permissions: {}
concurrency:
  group: toolchain-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            value=$(bash scripts/release/validate-tag.sh toolchain)
          else
            value=$(cat docker/toolchains/release-version.txt)
            source scripts/release/common.sh
            release_version "$value"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Freeze ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        name: [python, media, rust, java, kotlin, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build one AMD64 image and archive its exact identity
        run: bash scripts/release/image.sh build toolchain '${{ matrix.name }}' '${{ needs.version.outputs.value }}' 'release-artifact/${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.name }}
          path: release-artifact/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  native-gate:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: toolchain-python
          path: release-artifact/python
      - uses: actions/download-artifact@v4
        with:
          name: toolchain-browser
          path: release-artifact/browser
      - name: Build both source runtime bases and launch bundled browser natively
        run: bash scripts/release/gate.sh toolchain '${{ needs.version.outputs.value }}' release-artifact

      - name: Preserve native gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-gate-${{ github.run_id }}
          path: /tmp/eve-browser-release-evidence/*.log
          if-no-files-found: warn
          retention-days: 30

  prepublish:
    if: github.event_name == 'push'
    needs: [version, native-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject any existing version before the first push
        run: |
          bash scripts/release/validate-tag.sh toolchain
          bash scripts/release/prepublish.sh toolchain '${{ needs.version.outputs.value }}'

  publish:
    if: github.event_name == 'push'
    needs: [version, native-gate, prepublish]
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [python, media, rust, java, kotlin, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ matrix.name }}
          path: release-artifact/${{ matrix.name }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the frozen archive once, after all builds and the native gate
        run: |
          bash scripts/release/validate-tag.sh toolchain
          bash scripts/release/image.sh publish toolchain '${{ matrix.name }}' '${{ needs.version.outputs.value }}' 'release-artifact/${{ matrix.name }}'
